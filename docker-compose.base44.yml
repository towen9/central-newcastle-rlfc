services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
